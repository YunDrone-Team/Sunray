name: sunray150_lidar
vehicle_type: uav

report:
  title: Sunray150 雷达款 测试报告

capabilities:
  visual_landing: true
  egoplanner: true

lidar:
  mid360_auto_check: true
  mid360_iface: auto
  mid360_config_path: ~/sunray_map/src/livox_ros_driver2/config/MID360_config.json

topics:
  front_camera: ""
  down_camera: ""
  battery: "/uav{uav_id}/mavros/battery"
  uav_state: "/uav{uav_id}/sunray/uav_state"
  uav_control_cmd: "/uav{uav_id}/sunray/uav_control_cmd"
  uav_setup: "/uav{uav_id}/sunray/setup"
  lidar_pointcloud: "/uav{uav_id}/livox/lidar"
  ego_global_pointcloud: "/uav{uav_id}/global_points"
  ego_bspline: "/drone_0_planning/bspline"
  ego_pos_cmd: "/uav{uav_id}/pos_cmd"

recording:
  bag_prefix: sunray150_lidar
  topic_templates:
    - "/uav{uav_id}/mavros/local_position/pose"
    - "/uav{uav_id}/sunray/uav_state"
    - "/uav{uav_id}/sunray_detect/qrcode_detection_ros"
    - "/uav{uav_id}/sunray_detect/landmark_detection_ros"

defaults:
  hardware_check_timeout_s: 5.0
  camera_sample_duration_s: 1.5
  camera_min_messages: 3
  camera_min_rate_hz: 2.0
  camera_max_gap_s: 1.0
  camera_max_identical_frame_ratio: 0.95
  camera_black_mean_threshold: 25.0
  camera_black_dynamic_range_threshold: 8
  camera_max_black_frame_ratio: 0.8
  camera_require_timestamp_progress: true
  camera_require_frame_content_change: false
  battery_pass_threshold_v: 13.8
  takeoff_target_z_m: 1.0
  takeoff_reach_radius_m: 0.12
  takeoff_stable_time_s: 2.0
  takeoff_timeout_s: 40.0
  takeoff_command_rate_hz: 20.0
  post_takeoff_settle_time_s: 5.0
  waypoint_source: list
  waypoint_stable_time_s: 3.0
  waypoint_hold_time_s: 2.0
  waypoint_timeout_s: 40.0
  visual_landing_auto_takeoff: false
  visual_landing_height_m: 1.0
  visual_landing_target_zone_radius_m: 0.21
  hover_duration_s: 120.0
  waypoint_reach_radius_m: 0.13
  waypoint_analysis_use_xy_only: true
  ego_goal_z_m: 1.0
  ego_goal_reach_radius_m: 0.13
  ego_goal_stable_time_s: 2.0
  ego_goal_hold_time_s: 1.0
  ego_goal_timeout_s: 45.0
  ego_goal_publish_burst_count: 3
  ego_goal_publish_burst_interval_s: 0.1
  ego_goal_source: list
  ego_goal_use_xy_only: true
  ego_keepalive_enabled: true
  ego_keepalive_rate_hz: 20.0
  ego_keepalive_stale_timeout_s: 0.5
  ego_keepalive_zero_velocity_epsilon: 0.001
  ego_post_transition_enabled: true
  ego_post_transition_target_yaw_rad: 0.0
  ego_post_transition_yaw_rate_rad_s: 0.65
  ego_post_transition_hold_after_s: 2.0
  ego_post_transition_target_z_m: 1.2
