name: sunray150_lidar_sim
display_name: sunray150_lidar_sim
description: Sunray150 Lidar 仿真环境标品出货测试

runner:
  platform: sunray150_lidar
  environment: sim
  suite: lidar_acceptance
  uav_id: 1
  external_source: 2

windows:
  - title: Sunray Lidar Sim Bringup
    after_launch_delay_s: 0.3
    tabs:
      - title: simulator
        command: roslaunch sunray_simulator sunray_sim_test_basic.launch vehicle:=sunray150_with_mid360
      - title: ego
        delay_s: 1.0
        command: roslaunch sunray_test sunray_tests_ego.launch rivz_config:=$(rospack find sunray_test)/launch/sunray_tests_sim.rviz
      - title: fusion
        delay_s: 2.0
        command: roslaunch sunray_uav_control external_fusion.launch external_source:={external_source} enable_rviz:=false
      - title: control
        delay_s: 3.0
        command: roslaunch sunray_uav_control sunray_control_node.launch uav_id:={uav_id} Takeoff_height:=1.0
      - title: terminal_control
        delay_s: 2.0
        command: roslaunch sunray_uav_control terminal_control.launch uav_id:={uav_id}
      - title: detection
        delay_s: 2.0
        command: roslaunch sunray_test detection_dual.launch down_image_topic:=/uav{uav_id}/monocular_down/image_raw down_camera_info_topic:=/uav{uav_id}/monocular_down/camera_info

  - title: Sunray Test Runner
    tabs:
      - title: run_suite
        delay_s: 2.0
        command: rosrun sunray_test run_suite.py {runner_cli}
