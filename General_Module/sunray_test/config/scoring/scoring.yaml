        final_landing_position_error_m: { thresholds: [0.015, 0.060, 0.150, 0.375], weight: 0.20 }
        final_descent_trigger_xy_error_m: { thresholds: [0.020, 0.080, 0.180, 0.400], weight: 0.10 }
        target_acquisition_time_s: { thresholds: [0.3, 1.5, 3.8, 7.5], weight: 0.10 }
