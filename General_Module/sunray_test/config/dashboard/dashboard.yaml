name: dashboard
description: Runtime suite generated by the Sunray test dashboard
report_title: Sunray Dashboard 测试报告
default_items:
  - battery

runtime_profiles:
  default: sunray150_basic
  rules:
    - any_items: [lidar, ego_goal]
      profile: sunray150_lidar

external_sources:
  exp: 3
  sim: 2

test_items:
  - id: front_camera
    name: 前视相机
    group: hardware
    step:
      case: front_camera_alive
      name: 前视相机
      type: hardware.camera_alive
      params:
        topic_key: front_camera

  - id: down_camera
    name: 下视相机
    group: hardware
    step:
      case: down_camera_alive
      name: 下视相机
      type: hardware.camera_alive
      params:
        topic_key: down_camera

  - id: battery
    name: 电池电压
    group: hardware
    step:
      case: battery_voltage
      name: 电池电压
      type: hardware.battery_voltage
      params:
        topic_key: battery

  - id: lidar
    name: 激光雷达
    group: hardware
    tags: [雷达相关]
    step:
      case: lidar_health_check
      name: 激光雷达
      type: hardware.lidar_health
      params:
        imu_topic_pattern: livox/imu
        lidar_topic_pattern: livox/lidar
        timeout_s: 10.0
        sample_duration_s: 3.0
        min_messages: 5
        min_rate_hz: 8.0
        max_gap_s: 1.0
        min_points_per_cloud: 700
        min_valid_clouds: 3

  - id: hover
    name: 悬停
    group: function
    requires_airborne: true
    required_hardware: [battery]
    step:
      case: hover_stability
      name: 悬停
      type: flight.hover

  - id: ego_goal
    name: EGO-Planner自主规划
    group: function
    requires_airborne: true
    required_hardware: [battery, lidar]
    tags: [雷达相关]
    step:
      case: ego_goal_flight
      name: EGO-Planner自主规划
      type: flight.ego_goal
      params:
        goal_topic: /move_base_simple/goal
        frame_id: world
        mission_key: lidar_ego_goals

  - id: waypoint
    name: 指点飞行
    group: function
    requires_airborne: true
    required_hardware: [battery]
    step:
      case: waypoint_flight
      name: 指点飞行
      type: flight.waypoint
      params:
        mission_key: waypoint_default

  - id: visual_landing
    name: 视觉降落
    group: function
    requires_airborne: true
    required_hardware: [battery, down_camera]
    step:
      case: visual_landing
      name: 视觉降落
      type: flight.visual_landing
      params:
        launch_args:
          error_xy: 0.07
          error_z: 0.22
          land_vel: 0.5
          last_land_time: 0.9
          drop_height: 0.1

bringup:
  rules:
    uses_lidar:
      any_items: [lidar, ego_goal]
    uses_basic_sim_rviz:
      none_items: [lidar, ego_goal]
    uses_camera:
      any_items: [front_camera, down_camera, visual_landing]
    uses_detection:
      any_items: [visual_landing]
    uses_flight:
      any_groups: [function]

  sim:
    tabs:
      - title: simulator
        when: always
        command: roslaunch sunray_simulator sunray_sim_test_basic.launch vehicle:={sim_vehicle}
      - title: rviz
        when: uses_basic_sim_rviz
        delay_s: 1.0
        command: roslaunch sunray_simulator sim_rviz.launch
      - title: fusion
        when: uses_flight
        delay_s: 2.0
        command: roslaunch sunray_uav_control external_fusion.launch external_source:={external_source} enable_rviz:=false
      - title: control
        when: uses_flight
        delay_s: 3.0
        command: roslaunch sunray_uav_control sunray_control_node.launch uav_id:={uav_id} Takeoff_height:=1.0
      - title: terminal_control
        when: uses_flight
        delay_s: 2.0
        command: roslaunch sunray_uav_control terminal_control.launch uav_id:={uav_id}
      - title: ego
        when: uses_lidar
        delay_s: 1.0
        command: roslaunch sunray_test sunray_tests_ego.launch rivz_config:=$(rospack find sunray_test)/launch/sunray_tests_sim.rviz
      - title: detection
        when: uses_detection
        delay_s: 2.0
        command: roslaunch sunray_test detection_dual.launch down_image_topic:=/uav{uav_id}/monocular_down/image_raw down_camera_info_topic:=/uav{uav_id}/monocular_down/camera_info

  exp:
    tabs:
      - title: mavros
        when: uses_flight
        command: roslaunch sunray_uav_control sunray_mavros_exp.launch
      - title: web_cam
        when: always
        delay_s: 5.0
        command: roslaunch sunray_test web_cam_dual.launch camera_profile:={camera_profile}
      - title: fusion
        when: uses_flight
        delay_s: 5.0
        command: roslaunch sunray_uav_control external_fusion.launch external_source:={external_source}
      - title: control
        when: uses_flight
        delay_s: 2.0
        command: roslaunch sunray_uav_control sunray_control_node.launch uav_id:={uav_id} Takeoff_height:=1.0
      - title: terminal_control
        when: uses_flight
        delay_s: 2.0
        command: roslaunch sunray_uav_control terminal_control.launch uav_id:={uav_id}
      - title: detection
        when: uses_detection
        delay_s: 10.0
        command: roslaunch sunray_test detection_dual.launch down_image_topic:=/web_cam/image_raw down_camera_info_topic:=/web_cam/camera_info
      - title: mid360_driver
        when: uses_lidar
        delay_s: 4.0
        command: roslaunch sunray_planner_utils msg_MID360.launch
      - title: mid360_mapping
        when: uses_lidar
        delay_s: 6.0
        command: roslaunch sunray_planner_utils mapping_mid360.launch rviz:=false
      - title: ego
        when: ego_goal
        delay_s: 8.0
        command: roslaunch sunray_test sunray_tests_ego.launch odom_topic:=/Odometry global_pointcloud_topic:=/cloud_registered enable_point_cloud_transform:=false enable_rviz:=true rivz_config:=$(rospack find sunray_test)/launch/sunray_tests_exp.rviz

runner:
  sim:
    tabs:
      - title: run_suite
        delay_s: 2.0
        command: rosrun sunray_test run_test_dashboard.py {runner_cli}
  exp:
    tabs:
      - title: run_suite
        delay_s: 15.0
        command: rosrun sunray_test run_test_dashboard.py {runner_cli}

variables:
  camera_profile:
    default: sunray150_basic
    rules:
      - when: uses_lidar
        value: sunray150_lidar
  sim_vehicle:
    default: sunray150
    rules:
      - when: uses_lidar
        value: sunray150_with_mid360
